<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    .row { margin-bottom: 15px; }
    label { display: block; font-size: 11px; margin-bottom: 3px; color: #555; }
    select, input { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    .switch-btn { width: 100%; padding: 10px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; }
    .btn-off { background: #dc3545; color: white; }
    .btn-on { background: #28a745; color: white; }
    #log-area { height: 120px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 5px; overflow-y: scroll; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>LicitaBOT PRO</h3>
  <div id="cnpj-display" style="font-size: 10px; color: #888; margin-bottom: 10px;">Detectando CNPJ...</div>
  
  <div class="row">
    <label>Alvo (Posição):</label>
    <select id="alvoPosicao">
      <option value="1">1º Lugar</option>
      <option value="2">2º Lugar</option>
      <option value="3">3º Lugar</option>
    </select>
  </div>
  <div class="row">
    <label>Decremento Mínimo (R$):</label>
    <input type="number" id="decremento" value="0.01" step="0.01">
  </div>
  <div class="row">
    <label>Tempo Dif. Lances (Seg):</label>
    <input type="number" id="tempoDif" value="3">
  </div>
  <div class="row">
    <label>Exequibilidade (%):</label>
    <input type="number" id="exeq" value="50">
  </div>
  <div class="row">
    <label>Preço Mínimo (R$):</label>
    <input type="number" id="precoMinimo" value="0.00">
  </div>
  <button id="toggleBtn" class="switch-btn btn-off">LIGAR BOT</button>
  <div id="log-area">Aguardando...</div>
  <script src="popup.js"></script>
</body>
</html>
